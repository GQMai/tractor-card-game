<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<title>拖拉机 · 现代重制版</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="assets/tractor.ico">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <div class="brand-mark">拖</div>
      <div class="brand-text"><b>拖拉机</b><span>现代重制版</span></div>
    </div>

    <div class="teams">
      <div class="team" id="team0">
        <span class="team-name">南北</span>
        <span class="team-level" id="lvl0">2</span>
        <span class="banker-badge" id="banker0">庄</span>
      </div>
      <div class="team" id="team1">
        <span class="team-name">东西</span>
        <span class="team-level" id="lvl1">2</span>
        <span class="banker-badge" id="banker1">庄</span>
      </div>
    </div>

    <div class="round-info">
      <span id="trumpInfo">主牌 —</span>
      <span class="sep"></span>
      <span id="roundInfo">第 1 局 · 4 副</span>
    </div>

    <div class="score-box">
      <div class="score-label">闲家得分 <b id="scoreNow">0</b> / <span id="scoreLine">160</span></div>
      <div class="score-track">
        <div class="score-fill" id="scoreFill"></div>
      </div>
    </div>

    <div class="top-actions">
      <button class="pill" id="btnNew">新局</button>
      <button class="pill" id="btnRules">规则</button>
      <button class="pill" id="btnSound">音效：开</button>
    </div>
  </header>

  <main id="table">
    <div class="felt"></div>

    <div class="seat seat-top" id="seat2">
      <div class="seat-head">
        <span class="avatar team-a">北</span>
        <div class="seat-meta"><b>北家</b><span>队友</span></div>
        <span class="seat-tags" id="tags2"></span>
        <span class="card-count" id="count2">0</span>
      </div>
      <div class="seat-cards" id="cards2"></div>
    </div>

    <div class="seat seat-left" id="seat3">
      <div class="seat-head">
        <span class="avatar team-b">西</span>
        <div class="seat-meta"><b>西家</b><span>对手</span></div>
        <span class="seat-tags" id="tags3"></span>
        <span class="card-count" id="count3">0</span>
      </div>
      <div class="seat-cards" id="cards3"></div>
    </div>

    <div class="seat seat-right" id="seat1">
      <div class="seat-head">
        <span class="avatar team-b">东</span>
        <div class="seat-meta"><b>东家</b><span>对手</span></div>
        <span class="seat-tags" id="tags1"></span>
        <span class="card-count" id="count1">0</span>
      </div>
      <div class="seat-cards" id="cards1"></div>
    </div>

    <div id="trickArea"></div>
    <div id="centerTip"><span id="centerTipText"></span></div>

    <div id="declareBar" class="hidden">
      <span class="declare-label">叫主</span>
      <button class="declare-btn" data-suit="0" title="叫方块">♦</button>
      <button class="declare-btn" data-suit="1" title="叫梅花">♣</button>
      <button class="declare-btn" data-suit="2" title="叫红桃">♥</button>
      <button class="declare-btn" data-suit="3" title="叫黑桃">♠</button>
      <button class="declare-btn nt" data-suit="4" title="叫无主">无主</button>
    </div>

    <div id="handZone">
      <div id="handBar">
        <div class="hand-status">
          <span class="seat-tags" id="tags0"></span>
          <div id="handHint">等待发牌…</div>
        </div>
        <div class="hand-buttons">
          <button class="action ghost" id="btnClear">重选</button>
          <button class="action ghost" id="btnHint">提示</button>
          <button class="action primary" id="btnPlay">出牌</button>
        </div>
      </div>
      <div id="handCards"></div>
    </div>
  </main>

  <div id="toast"></div>
  <div id="modal" class="hidden">
    <div class="modal-card">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div id="modalActions"></div>
    </div>
  </div>

</div>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
